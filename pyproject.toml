[project]
name = "treeforge"
version = "0.1.0"
description = "TreeForge（树锻）—— 人走一遍，树锻一生。把人类在浏览器里的示教操作蒸馏成可复用的 site-specific skill 文件，最终供 TreeWalker 消费。"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jason" }]
dependencies = [
    "pydantic>=2.6,<3.0",
    # P2 采集层：DOM 快照公共库（本地 editable 见 [tool.uv.sources]）
    "dom-snapshot>=0.1.0",
    # P2 采集层：连浏览器（CdpSession 用）
    "cdp-use>=1.4.5",
    # P2 采集层：capture 子命令的 HTTP server（一次性命令，保留给无 UI 脚本场景）
    "aiohttp>=3.9,<4.0",
    # P3 常驻服务：FastAPI app + uvicorn ASGI server（treeforge serve）
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
# Console script 名与项目名/包名一致：treeforge。三种调用等价：
#   uv run treeforge distill ...
#   uv run python -m treeforge distill ...
#   import treeforge
treeforge = "treeforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treeforge", "harness", "adapters", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["treeforge", "harness", "adapters"]

[tool.uv.sources]
# 本地 editable 开发：dom-snapshot 源码在 ../dom-snapshot（与 treeforge 同级）。
# 远端/CI 可改成 { git = "https://github.com/zjordon/dom-snapshot.git", tag = "v0.1.0" }。
dom-snapshot = { path = "../dom-snapshot", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
