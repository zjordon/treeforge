[project]
name = "treeforge"
version = "0.1.0"
description = "TreeForge（树锻）—— 人走一遍，树锻一生。把人类在浏览器里的示教操作蒸馏成可复用的 site-specific skill 文件，最终供 TreeWalker 消费。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jason" }]
dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
# Console entry named `treewalker` (the consumer name) so the P0 acceptance
# command `uv run treewalker distill ...` works. Package import name stays
# `treeforge`. See init-plan.md §6.
treewalker = "treeforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treeforge", "harness", "adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["treeforge", "harness", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
