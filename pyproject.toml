[project]
name = "treeforge"
version = "0.1.0"
description = "TreeForge（树锻）—— 人走一遍，树锻一生。把人类在浏览器里的示教操作蒸馏成可复用的 site-specific skill 文件，最终供 TreeWalker 消费。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jason" }]
dependencies = [
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
# Console script 名与项目名/包名一致：treeforge。三种调用等价：
#   uv run treeforge distill ...
#   uv run python -m treeforge distill ...
#   import treeforge
treeforge = "treeforge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treeforge", "harness", "adapters"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["treeforge", "harness", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
