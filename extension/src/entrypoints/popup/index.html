<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TreeForge Capture</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #333;
    }
    .status {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      background: #f5f5f5;
    }
    .status.recording {
      background: #fff0f0;
      color: #c00;
    }
    .status.idle {
      background: #f5f5f5;
      color: #666;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    label {
      min-width: 60px;
      color: #555;
    }
    input[type="text"], select {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    button.start {
      background: #2563eb;
      color: white;
    }
    button.start:hover {
      background: #1d4ed8;
    }
    button.stop {
      background: #dc2626;
      color: white;
    }
    button.stop:hover {
      background: #b91c1c;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .meta {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>TreeForge Capture</h1>

  <div id="status" class="status idle">未录制</div>

  <div class="row">
    <label for="endpoint">后端</label>
    <input id="endpoint" type="text" value="http://127.0.0.1:8765" />
  </div>

  <div class="row">
    <label for="scenario">场景</label>
    <select id="scenario">
      <option value="distill">distill（蒸馏采集）</option>
      <option value="replay">replay（重放录制，待实现）</option>
    </select>
  </div>

  <button id="toggle" class="start">开始录制</button>

  <div class="meta">
    <div>事件数：<span id="eventCount">0</span></div>
    <div id="hint"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
